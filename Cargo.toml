[package]
name = "sqlens"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A read-only SQLite database explorer for the terminal"
license = "MIT"
readme = "README.md"
repository = "https://github.com/torpedro/sqlens"
include = ["/src/**", "/tests/**", "/examples/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
serde_json = "1.0"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.27"

[profile.release]
lto = "thin"
strip = true
